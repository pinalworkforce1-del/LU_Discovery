<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover Me — Classroom Response</title><style>*{box-sizing:border-box}body{margin:0;background:#0c2033;color:#20374a;font:16px Arial,sans-serif}.card{margin:24px auto;max-width:620px;padding:24px;background:#fffaf0;border-radius:18px}h1{color:#102d49}.choice{width:100%;text-align:left;display:block;margin:9px 0;padding:17px;border:2px solid #c6d4dc;background:#fff;color:#172b3e;border-radius:12px;font-size:17px;cursor:pointer}.choice:focus-visible{outline:3px solid #e4a72b;outline-offset:2px}.choice.selected{border-color:#2f7d4c;background:#e7f5eb}.sub{color:#627789}.bar{height:9px;background:#e1e8ee;border-radius:8px;overflow:hidden}.bar i{height:100%;background:#2f7d4c;display:block}button{background:#102d49;border:0;border-radius:25px;padding:12px 16px;color:white;font-weight:700}.score{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:7px}</style></head><body><main class="card"><small>LEVEL UP LIVE • CAREER TREE</small><h1 id="title">Discover Me</h1><p class="sub" id="status">Connecting to facilitator…</p><div class="bar"><i id="bar" style="width:0"></i></div><div id="content"></div><p><button id="return">Return to Level Up Live</button></p></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';import{QUESTIONS,CHOICES}from'./onet-questions.js';
const $=id=>document.getElementById(id),room=new URLSearchParams(location.search).get('room')||'',clientKey='levelup-onet-client:'+room,storedKey='levelup-onet-answers:'+room;
let clientId=localStorage.getItem(clientKey);if(!clientId){clientId=crypto.randomUUID();localStorage.setItem(clientKey,clientId)}
let answers={};try{answers=JSON.parse(localStorage.getItem(storedKey)||'{}')}catch{}
let idx=0,done=false,connected=false;
const supabase=createClient('https://dnijrzotfyvmmnmueknk.supabase.co','sb_publishable_qSEo4iczJBozMaSIvTKisw_BsJy-iPc',{auth:{persistSession:false}});
const channel=supabase.channel('levelup:facilitator:'+room,{config:{broadcast:{self:false},presence:{key:clientId}}});
function save(){localStorage.setItem(storedKey,JSON.stringify(answers))}
function render(){const n=QUESTIONS.filter((_,i)=>Number(answers[i+1])>=1&&Number(answers[i+1])<=5).length;$('bar').style.width=n/30*100+'%';if(done&&n===30){results();return}if(done&&n<30){const missing=QUESTIONS.map((_,i)=>i+1).filter(i=>!(Number(answers[i])>=1&&Number(answers[i])<=5));if(!missing.includes(idx+1))idx=missing[0]-1;$('status').textContent='Assessment ended • '+missing.length+' responses remaining';}const q=QUESTIONS[idx];$('title').textContent='Question '+(idx+1)+' of 30';$('status').textContent=connected?'Room '+room+' • '+n+' of 30 answered':'Reconnecting…';$('content').innerHTML='<h2>'+q[1]+'</h2><p>How interested are you in this activity?</p>'+CHOICES.map(c=>'<button type="button" class="choice '+(answers[idx+1]===c.value?'selected':'')+'" data-v="'+c.value+'">'+c.emoji+' '+c.label+'</button>').join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{answers[idx+1]=Number(b.dataset.v);save();const completedQuestion=idx+1;if(done){const nextMissing=QUESTIONS.findIndex((_,i)=>!(Number(answers[i+1])>=1&&Number(answers[i+1])<=5));if(nextMissing>=0)idx=nextMissing;}render();if(connected)await channel.send({type:'broadcast',event:'onet_answered',payload:{index:completedQuestion,clientId}})})}
function results(){const scores={R:0,I:0,A:0,S:0,E:0,C:0};QUESTIONS.forEach((q,i)=>scores[q[0]]+=Number(answers[i+1])-1);const top=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]||a.localeCompare(b)).slice(0,3);$('title').textContent='Your interest profile: '+top.join('');$('status').textContent='Completed • Results saved on this device';$('content').innerHTML='<p>Your strongest interest areas are '+top.join(', ')+'.</p>'+Object.entries(scores).map(([k,v])=>'<div class="score"><b>'+k+'</b><span>'+v+'/20</span></div>').join('')+'<p class="sub">Keep this device to retain your results. Individual results are not yet linked to your Career Tree coach record.</p>'}
channel.on('broadcast',{event:'facilitator_state'},({payload:p})=>{if(p?.mode==='onet_complete'&&p?.module==='onet'){done=true;render()}else if(p?.module==='onet'){idx=Math.max(0,Math.min(29,Number(p.question?.index||1)-1));render()}else if(p?.mode==='map'){location.replace('join-live.html?room='+encodeURIComponent(room))}}).on('broadcast',{event:'onet_complete'},()=>{done=true;render()}).subscribe(async s=>{connected=s==='SUBSCRIBED';if(connected){await channel.track({role:'participant',surface:'onet',online_at:new Date().toISOString()});await channel.send({type:'broadcast',event:'participant_hello',payload:{room}})}render()});
$('return').onclick=()=>location.href='join-live.html?room='+encodeURIComponent(room);render();
</script></body></html>
