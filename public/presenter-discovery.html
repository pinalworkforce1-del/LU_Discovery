.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2vw}.microCard{position:relative;min-height:28vh;border:2px solid #5fdff0;border-radius:18px;background:linear-gradient(145deg,#071127,#101337);padding:1.5vw;color:#fff;display:flex;flex-direction:column;justify-content:center;box-shadow:0 14px 34px #0007}.microCard.back{background:#fffaf0;color:var(--ink);border-color:var(--gold)}.microCard h3{margin:0 0 10px;font-size:clamp(20px,2vw,34px)}.microCard p{margin:6px 0;font-size:clamp(13px,1.15vw,19px);line-height:1.45}.visualCard{background:#fff;color:var(--ink);border:3px solid transparent;border-radius:16px;overflow:hidden;box-shadow:0 12px 28px #0006}.visualCard.reviewed{border-color:#9cc9a8}.visualCard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.visualCard div{padding:12px}.visualCard b{display:block;color:var(--navy);font-size:clamp(14px,1.25vw,21px)}.visualCard span{color:#617483;font-size:clamp(11px,1vw,16px)}.reviewedMark{position:absolute;right:10px;top:10px;background:#eff8f1;color:var(--green);border:1px solid #9cc9a8;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:950}

.wait{position:absolute;z-index:5;inset:0;display:grid;place-items:center;text-align:center;padding:4vw;background:radial-gradient(circle at 50% 40%,#153a57,#02040c 70%)}.wait h1{font-size:clamp(34px,5vw,76px);margin:0}.wait p{color:#c5d8e4;font-size:clamp(15px,1.6vw,24px)}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}.results{width:60vw}.detail{grid-template-columns:1fr}}
</style>

function microHtml(state){const m=state.displayMicro||{},type=m.type;if(!type)return'';if(type==='resume-skills'){const cards=[['🤝','Teamwork','Work toward a shared goal, communicate, and support the group.','Employers value people who contribute reliably and help the whole team succeed.','Worked with three classmates to divide tasks and finish a project by the deadline.'],['🧭','Leadership','Take initiative, guide others, and help a group move forward.','Employers value sound judgment, ownership, and positive influence.','Helped organize a volunteer event and showed new volunteers what needed to be done.'],['💬','Communication','Listen carefully and share clear information in the right way.','Employers value fewer misunderstandings and stronger customer and team relationships.','Explained order options to customers and answered questions during busy periods.'],['✓','Reliability','Follow through, arrive prepared, and do what you said you would do.','Employers need teammates they can count on without constant reminders.','Showed up consistently for practice and handled assigned equipment before each event.'],['🧩','Problem Solving','Notice what is wrong, consider options, and take a practical next step.','Employers value people who can keep work moving when challenges appear.','Found a scheduling conflict, compared options, and helped the group adjust the plan.']],flipped=new Set(m.flipped||[]);return '<div class="micro"><div class="microHeader"><small>Resume District</small><h1>Transferable Skill Cards</h1><p>Define the skills together before participants identify which ones they already use.</p></div><div class="microHint">Open the cards on the facilitator screen to reveal meaning, employer value, and an example.</div><div class="grid3">'+cards.map(function(c,i){return '<div class="microCard '+(flipped.has(i)?'back':'')+'"><h3><span style="font-size:26px">'+c[0]+'</span> '+esc(c[1])+'</h3><p>'+(flipped.has(i)?'<b>What it means:</b> '+esc(c[2])+'<br><br><b>Why employer
