<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level Up Discovery • Classroom Display</title>
<style>
:root{--navy:#102d49;--gold:#e4a72b;--cyan:#41e4f2;--green:#2f7d4c;--purple:#65558f;--ink:#21313e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040c;font-family:Inter,Arial,sans-serif;color:#fff}
#app{position:fixed;inset:0;background:#02040c;display:grid;place-items:center;overflow:hidden}.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;overflow:hidden;background:#02040c;box-shadow:0 0 0 1px #ffffff12,0 24px 80px #000c}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:0;transition:filter .35s ease,opacity .35s ease}
.scene.dim{filter:brightness(.35) saturate(.7);opacity:.82}
.captionMask{position:absolute;z-index:1;left:0;right:0;bottom:0;height:22%;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.52) 38%,rgba(0,0,0,.22) 72%,rgba(0,0,0,0) 100%);opacity:0;transition:opacity .15s ease;pointer-events:none}.captionMask.show{opacity:1}
.narration{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;mix-blend-mode:screen;background:transparent;pointer-events:none}
.badge{position:absolute;z-index:12;left:2%;top:2%;border:1px solid #62e8ff88;background:#071927dd;color:#fff;border-radius:999px;padding:.65vw 1vw;font-size:clamp(11px,1.15vw,18px);font-weight:900;letter-spacing:.06em}
.connection{position:absolute;z-index:15;right:2%;top:2%;background:#071927dd;border:1px solid #ffffff33;border-radius:999px;padding:.55vw .9vw;font-size:clamp(10px,1vw,15px);font-weight:850;color:#dce9f1}.connection.ok{border-color:#77c98d;color:#c9f2d4}
.prompt{position:absolute;z-index:10;left:5%;right:5%;bottom:4%;background:#071927f2;border-left:7px solid var(--gold);border-radius:18px;padding:1.4vw 1.8vw;box-shadow:0 20px 55px #000a}.prompt small{display:block;color:#f5d56e;font-size:clamp(11px,1vw,16px);font-weight:950;letter-spacing:.09em;text-transform:uppercase}.prompt h1{margin:.4vw 0 .45vw;font-size:clamp(26px,3.2vw,54px);line-height:1.08}.prompt p{margin:0;color:#dbe8ef;font-size:clamp(14px,1.35vw,22px);line-height:1.4}
.hotspots{position:absolute;z-index:7;inset:0;pointer-events:none}.hotspot{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);display:grid;place-items:center;border:3px solid var(--gold);border-radius:50%;background:#071927e8;color:#fff;font-size:18px;font-weight:1000;box-shadow:0 0 0 6px #e4a72b2c,0 10px 28px #0009}.hotspot.active{border-color:var(--cyan);background:#0d4354;box-shadow:0 0 0 8px #41e4f23b,0 12px 30px #000a}.hotspot.reviewed{border-color:#77c98d;background:#1f613a;box-shadow:0 0 0 5px #77c98d2d,0 10px 26px #0008}.hotspot.locked{opacity:.42}.hotspot label{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);white-space:nowrap;background:#071927ee;border:1px solid #ffffff44;border-radius:999px;padding:7px 10px;font-size:12px}.hotspot:not(.active) label{display:none}
.guide{position:absolute;z-index:8;left:50%;top:4%;transform:translateX(-50%);max-width:76%;background:#071927eb;border:1px solid #5fdff077;border-radius:13px;padding:10px 14px;text-align:center;font-size:clamp(12px,1.15vw,18px);font-weight:850;box-shadow:0 10px 26px #0008}.guide b{color:#f5d56e}
.results{position:absolute;z-index:11;right:4%;top:13%;width:min(42%,700px);max-height:52%;overflow:auto;background:#f8fbfcf5;color:var(--ink);border:3px solid var(--gold);border-radius:18px;padding:18px;box-shadow:0 20px 58px #000b}.results h2{margin:0 0 12px;color:var(--navy);font-size:clamp(18px,2vw,30px)}.barRow{display:grid;grid-template-columns:minmax(160px,1fr) 1.4fr 60px;gap:10px;align-items:center;margin:8px 0}.barLabel{font-size:clamp(12px,1.05vw,17px)}.bar{height:20px;border-radius:999px;background:#dde6eb;overflow:hidden}.bar span{display:block;height:100%;background:var(--purple)}.pct{text-align:right;font-weight:950;color:var(--navy)}.responses{display:grid;grid-template-columns:1fr 1fr;gap:10px}.response{background:#fff;border:1px solid #cbd6df;border-radius:12px;padding:12px;font-size:clamp(12px,1.05vw,17px);line-height:1.4}
.micro{position:absolute;z-index:20;inset:0;background:#03101bf5;padding:4% 4%;overflow:auto}.microHeader small{color:#b78de0;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.microHeader h1{margin:.5vh 0 1vh;font-size:clamp(30px,4vw,64px)}.microHeader p{margin:0 0 2vh;color:#bfd0da;font-size:clamp(14px,1.4vw,22px)}.microHint{padding:10px 14px;border:1px solid #5fdff066;border-radius:12px;background:#06182cd9;color:#d9f6fb;font-size:clamp(12px,1.1vw,18px);font-weight:800;margin-bottom:2vh}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2vw}.microCard{position:relative;min-height:28vh;border:2px solid #5fdff0;border-radius:18px;background:linear-gradient(145deg,#071127,#101337);padding:1.5vw;color:#fff;display:flex;flex-direction:column;justify-content:center;box-shadow:0 14px 34px #0007}.microCard.back{background:#fffaf0;color:var(--ink);border-color:var(--gold)}.microCard h3{margin:0 0 10px;font-size:clamp(20px,2vw,34px)}.microCard p{margin:6px 0;font-size:clamp(13px,1.15vw,19px);line-height:1.45}.visualCard{background:#fff;color:var(--ink);border:3px solid transparent;border-radius:16px;overflow:hidden;box-shadow:0 12px 28px #0006}.visualCard.reviewed{border-color:#9cc9a8}.visualCard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.visualCard div{padding:12px}.visualCard b{display:block;color:var(--navy);font-size:clamp(14px,1.25vw,21px)}.visualCard span{color:#617483;font-size:clamp(11px,1vw,16px)}.reviewedMark{position:absolute;right:10px;top:10px;background:#eff8f1;color:var(--green);border:1px solid #9cc9a8;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:950}
.detailMask{position:absolute;z-index:28;inset:0;background:#020915d9;backdrop-filter:blur(3px)}.detail{position:absolute;z-index:29;left:7%;right:7%;top:8%;max-height:84%;overflow:auto;display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.35fr);gap:24px;background:#fffaf0;color:var(--ink);border:4px solid var(--gold);border-radius:22px;padding:24px;box-shadow:0 26px 64px #000d}.detail img{width:100%;border-radius:14px;align-self:center}.detail h2{color:var(--navy);font-size:clamp(26px,2.8vw,46px);margin:0 0 12px}.detail p{font-size:clamp(14px,1.25vw,20px);line-height:1.5;margin:8px 0}
.resource{position:absolute;z-index:25;inset:0;background:#02040cf5;display:grid;place-items:center;padding:4% 4%}.resourceBox{width:min(90vw,1200px);height:min(82vh,760px);border:3px solid var(--gold);border-radius:18px;overflow:hidden;background:#000;box-shadow:0 24px 64px #000c}.resource iframe{width:100%;height:100%;border:0}
.unlock{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#071927,#102d49)}.unlock.hide{display:none}.unlockCard{text-align:center;max-width:700px;padding:34px}.unlockCard small{color:#f5d56e;font-weight:950;letter-spacing:.1em;text-transform:uppercase}.unlockCard h1{font-size:clamp(32px,5vw,68px);margin:10px 0}.unlockCard p{color:#dce9f1;font-size:clamp(15px,1.6vw,23px);line-height:1.5}.unlockCard button{border:0;border-radius:999px;background:var(--gold);color:#1d2d38;font-size:20px;font-weight:950;padding:14px 22px;cursor:pointer}
.wait{position:absolute;z-index:5;inset:0;display:grid;place-items:center;text-align:center;padding:4vw;background:radial-gradient(circle at 50% 40%,#153a57,#02040c 70%)}.wait h1{font-size:clamp(34px,5vw,76px);margin:0}.wait p{color:#c5d8e4;font-size:clamp(15px,1.6vw,24px)}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}.results{width:60vw}.detail{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="unlock" id="unlock"><div class="unlockCard"><small>Level Up Discovery</small><h1>Classroom Display</h1><p>Use this screen on the projector or classroom monitor. After entering, the facilitator console controls scenes, Aria, activities, hotspots, and anonymous room results.</p><button id="enter" type="button">Enter Classroom Display</button></div></div>
<div id="app"><div class="wait" id="wait"><div><h1>Level Up Discovery</h1><p>Waiting for the facilitator…</p></div></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';
const SUPABASE_URL='https://dnijrzotfyvmmnmueknk.supabase.co',SUPABASE_KEY='sb_publishable_qSEo4iczJBozMaSIvTKisw_BsJy-iPc';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const params=new URLSearchParams(location.search),room=(params.get('room')||'').toUpperCase().replace(/[^A-Z2-9]/g,''),app=document.getElementById('app'),unlock=document.getElementById('unlock');
const storyHotspots=[{id:'mentor',label:'Moment 1 • Mentor / Woodworking',left:69,top:27.5},{id:'group',label:'Moment 2 • Group Interaction',left:17.5,top:25}];
const valueHotspots=[{id:'papers',label:'Moment 1 • Help with the Papers',left:19.5,top:41},{id:'groceries',label:'Moment 2 • Help with the Groceries',left:50.5,top:39.5},{id:'cleanup',label:'Moment 3 • Community Cleanup',left:80,top:41}];
const energyCards=[['Drained','Overwhelm can be a clue that the task, setting, support, or timing is not working yet.','What could make this moment easier?'],['Engaged','Focus and energy often appear when a task connects with an interest or a strength.','What is helping the person stay engaged?'],['The Difference','Strength discovery is not about being good at everything. It is about noticing where you come alive and what helps you succeed.','When do you feel most focused?']];
const strengthCards=[['Problem Solving & Teaching','assets/discovery/strength-lens/build-teach.webp','Testing how pieces fit while guiding someone else with patience.','Problem solving • Teaching • Patience • Technical thinking'],['Listening & Communication','assets/discovery/strength-lens/listen-connect.webp','Listening closely, sharing ideas, and building trust.','Listening • Communication • Empathy • Trust'],['Troubleshooting & Persistence','assets/discovery/strength-lens/repair-persist.webp','Inspecting details and staying with a problem instead of giving up.','Troubleshooting • Persistence • Detail'],['Creativity & Digital Skills','assets/discovery/strength-lens/create-design.webp','Combining imagination with a technical tool and refining an idea.','Creativity • Digital skills • Focus'],['Teamwork & Technical Thinking','assets/discovery/strength-lens/solve-together.webp','Working together, discussing options, and contributing to a solution.','Teamwork • Technical thinking • Cooperation'],['Helping, Learning & Patience','assets/discovery/strength-lens/learn-help.webp','Contributing to a task while learning from someone else.','Helping • Learning • Patience'],['Dependability & Supporting Others','assets/discovery/strength-lens/show-up.webp','Noticing what needs to be done and following through.','Dependability • Responsibility • Initiative']];
const valueCards=[['Belonging to a Team','assets/discovery/value-lens/comfort-friend.webp','Teammates gather around a player who is down on the court.','They stop, stay close, and make sure the person is not facing the moment alone.','Respect'],['Having an Honest Conversation','assets/discovery/value-lens/honest-talk.webp','Two people speak face-to-face during a serious conversation.','They remain present, listen, and give the conversation their full attention.','Respect'],['Handling Responsibilities','assets/discovery/value-lens/responsibility.webp','A young person manages groceries and an everyday responsibility.','They are taking care of a practical need and following through.','Stability'],['Solving Something Together','assets/discovery/value-lens/shared-project.webp','Two people work side-by-side on a hands-on technical project.','They share tools, ideas, and attention while working toward the same result.','Creativity'],['Investing in the Future','assets/discovery/value-lens/think-it-through.webp','A young person studies independently at a focused workspace.','They devote time and effort now to build knowledge and future options.','Learning']];
let current=null,connected=false,entered=false,video=null,lastSlide=null;
function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function asset(slide,type){return 'assets/discovery/scenes/'+type+'-'+String(slide).padStart(2,'0')+'.'+(type==='slide'?'webp':'mp4')}
function youtubeEmbed(url){try{const u=new URL(url);let id='';if(u.hostname.includes('youtu.be'))id=u.pathname.replace('/','');else id=u.searchParams.get('v')||'';return id?'https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0':''}catch(_){return''}}
function hotspotHtml(kind,state){const items=kind==='story'?storyHotspots:valueHotspots,reviewed=new Set((state.reviewedHotspots&&state.reviewedHotspots[kind])||[]),active=state.activeHotspotId||((state.question&&state.question.hotspotId)||null);let guide='';if(kind==='story')guide=reviewed.size===0?'Start with <b>Moment 1</b>.':reviewed.size===1?'Moment 1 reviewed. Move to <b>Moment 2</b>.':'Both visual moments reviewed.';else guide=reviewed.size===items.length?'All three moments explored. <b>Each choice reveals what matters.</b>':'<b>'+reviewed.size+' of '+items.length+' explored.</b> Consider the choice, then name the values it could demonstrate.';return '<div class="guide">'+guide+'</div><div class="hotspots">'+items.map(function(h,i){const locked=kind==='story'&&h.id==='group'&&!reviewed.has('mentor'),rev=reviewed.has(h.id),act=active===h.id;return '<div class="hotspot '+(rev?'reviewed ':'')+(act?'active ':'')+(locked?'locked':'')+'" style="left:'+h.left+'%;top:'+h.top+'%"><span>'+(locked?'🔒':rev?'✓':String(i+1))+'</span><label>'+esc(h.label)+'</label></div>'}).join('')+'</div>'}
function resultsHtml(state){const r=state.results,q=state.question;if(!r||!q)return'';if(q.kind==='private_text')return '<div class="results"><h2>Private reflection</h2><p>Participants are writing privately on their own devices. Written responses are not projected.</p></div>';if(r.kind==='text'){if(!state.showReflections||!r.items||!r.items.length)return'';return '<div class="results"><h2>Anonymous responses</h2><div class="responses">'+r.items.map(function(x){return '<div class="response">'+esc(x)+'</div>'}).join('')+'</div></div>'}if(r.kind==='options'&&state.revealed){const total=Math.max(1,r.count||0);return '<div class="results"><h2>Room responses</h2>'+r.options.map(function(o,i){const count=(r.counts&&r.counts[i])||0,pct=Math.round(count/total*100);return '<div class="barRow"><div class="barLabel">'+esc(o)+'</div><div class="bar"><span style="width:'+pct+'%"></span></div><div class="pct">'+pct+'%</div></div>'}).join('')+'</div>'}return''}
function promptHtml(state){const q=state.question;if(!q)return'';return '<div class="prompt"><small>'+esc(q.phase||state.stageLabel||'Discovery')+'</small><h1>'+esc(q.prompt)+'</h1><p>'+esc(q.help||'')+'</p></div>'}
function microHtml(state){const m=state.displayMicro||{},type=m.type;if(!type)return'';if(type==='energy'){const flipped=new Set(m.flipped||[]);return '<div class="micro"><div class="microHeader"><small>Shared micro-lesson</small><h1>Energy Check</h1><p>The same person can feel very different in two situations.</p></div><div class="microHint">Compare what drains energy with what helps someone engage.</div><div class="grid3">'+energyCards.map(function(c,i){return '<div class="microCard '+(flipped.has(i)?'back':'')+'"><h3>'+esc(c[0])+'</h3><p>'+(flipped.has(i)?esc(c[1]):esc(c[2]))+'</p></div>'}).join('')+'</div></div>'}
const kind=type==='strength'?'strength':type==='values-action'?'values':null;if(!kind)return'';const cards=kind==='strength'?strengthCards:valueCards,reviewed=new Set((state.reviewedVisualCards&&state.reviewedVisualCards[kind])||[]);let out='<div class="micro"><div class="microHeader"><small>'+(kind==='strength'?'Strengths explorer':'Values explorer')+'</small><h1>'+(kind==='strength'?'Strength Lens':'Values in Action')+'</h1><p>'+(kind==='strength'?'Explore strengths in action and connect visible evidence to transferable skills.':'Explore how choices can reveal what matters.')+'</p></div><div class="microHint">'+reviewed.size+' of '+cards.length+' explored • You do not need to open every card.</div><div class="grid3">'+cards.map(function(c,i){return '<div class="visualCard '+(reviewed.has(i)?'reviewed':'')+'" style="position:relative">'+(reviewed.has(i)?'<span class="reviewedMark">✓ Reviewed</span>':'')+'<img src="'+c[1]+'" alt=""><div><b>'+esc(c[0])+'</b><span>'+(kind==='values'?'What value might this reveal?':esc(c[3]))+'</span></div></div>'}).join('')+'</div></div>';if(Number.isInteger(m.visualIndex)&&cards[m.visualIndex]){const c=cards[m.visualIndex];out+='<div class="detailMask"></div><div class="detail"><img src="'+c[1]+'" alt=""><div><h2>'+esc(c[0])+'</h2><p><b>What is happening:</b> '+esc(c[2])+'</p>'+(kind==='values'?'<p><b>Evidence:</b> '+esc(c[3])+'</p><p><b>Possible value:</b> '+esc(c[4])+'</p><p><b>Discuss:</b> What do you observe first, and what makes that value a reasonable interpretation?</p>':'<p><b>Strengths:</b> '+esc(c[3])+'</p><p><b>Discuss:</b> What visible evidence makes those strengths transferable to another setting?</p>')+'</div></div>'}return out}
function render(state){current=state||current;if(!current)return;if(current.ended){app.innerHTML='<div class="wait"><div><h1>Session Complete</h1><p>Thanks for participating in Level Up Discovery.</p></div></div>';return}if(current.mode==='stage_complete'){app.innerHTML='<div class="wait"><div><h1>'+esc((current.stageLabel||'Discovery')+' Complete')+'</h1><p>Stay with your facilitator for the next part of the journey.</p></div></div>';return}const s=current.scene||{slide:1,title:'Discovery',total:10},slide=Number(s.slide||1);let body='<div class="stage"><img class="scene" id="scene" src="'+asset(slide,'slide')+'" alt=""><div class="captionMask" id="captionMask"></div><video class="narration" id="narration" playsinline preload="metadata" muted><source src="'+asset(slide,'narration')+'" type="video/mp4"></video><div class="badge">DISCOVERY • '+esc((current.stageLabel||'').toUpperCase())+' • SCENE '+slide+'</div><div class="connection '+(connected?'ok':'')+'">'+(connected?'Display connected':'Connecting…')+'</div>';
if(current.mode==='story_select'||current.mode==='story')body+=hotspotHtml('story',current);if(current.mode==='values_hotspot_select'||(current.mode==='activity'&&current.question&&current.question.hotspotId))body+=hotspotHtml('values',current);if((current.mode==='story'||current.mode==='activity')&&current.question)body+=promptHtml(current)+resultsHtml(current);body+=microHtml(current);
if(current.displayResource&&current.displayResource.url){const emb=youtubeEmbed(current.displayResource.url);if(emb)body+='<div class="resource"><div class="resourceBox"><iframe src="'+emb+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div>'}
body+='</div>';app.innerHTML=body;video=document.getElementById('narration');lastSlide=slide;if(video){video.muted=true;video.addEventListener('play',function(){const m=document.getElementById('captionMask');if(m)m.classList.add('show')});video.addEventListener('pause',function(){const m=document.getElementById('captionMask');if(m)m.classList.remove('show')})}}
async function applyMedia(p){if(!entered||!p)return;if(!video||Number(p.slide)!==lastSlide){if(current)render(current);await new Promise(function(r){setTimeout(r,80)})}if(!video)return;video.muted=!!p.muted;try{if(Number.isFinite(Number(p.time))&&Math.abs(video.currentTime-Number(p.time))>.75)video.currentTime=Number(p.time)}catch(_){}
if(p.action==='play'){try{await video.play()}catch(_){}}else if(p.action==='pause'){video.pause()}else if(p.action==='replay'){try{video.currentTime=0;await video.play()}catch(_){}}else if(p.action==='mute'){video.muted=!!p.muted}}
if(room.length<8){app.innerHTML='<div class="wait"><div><h1>Room link incomplete</h1><p>Open this display from the facilitator console.</p></div></div>'}
const clientId='display-'+Math.random().toString(36).slice(2,12),channel=supabase.channel('levelup:facilitator:'+room,{config:{broadcast:{self:false},presence:{key:clientId}}});
channel.on('broadcast',{event:'facilitator_state'},function(msg){render(msg.payload||null)}).on('broadcast',{event:'display_media'},function(msg){applyMedia(msg.payload)}).on('broadcast',{event:'session_ended'},function(){if(current){current.ended=true;render(current)}}).subscribe(async function(status){if(status==='SUBSCRIBED'){connected=true;await channel.track({role:'display',online_at:new Date().toISOString()});await channel.send({type:'broadcast',event:'display_hello',payload:{client_id:clientId,at:new Date().toISOString()}});if(current)render(current)}else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)){connected=false;if(current)render(current)}});
document.getElementById('enter').addEventListener('click',async function(){entered=true;unlock.classList.add('hide');if(document.documentElement.requestFullscreen){try{await document.documentElement.requestFullscreen()}catch(_){}}await channel.send({type:'broadcast',event:'display_hello',payload:{client_id:clientId,at:new Date().toISOString(),entered:true}})});
window.addEventListener('beforeunload',function(){try{channel.untrack();supabase.removeChannel(channel)}catch(_){}});
</script>
</body>
</html>
