<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level Up · Expo Manager</title><style>body{margin:0;background:#091827;color:#e9f3ff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:28px}h1{font-size:2rem}section{background:#142b40;border:1px solid #36516b;border-radius:16px;padding:20px;margin:16px 0}input,select,button{font:inherit;padding:11px;border-radius:9px;margin:5px;border:1px solid #6e8aa4}input,select{background:#fff;color:#102338}button,.link{background:#e3aa39;color:#13243a;font-weight:700;cursor:pointer}.link{display:inline-block;padding:11px;border-radius:9px;text-decoration:none}label{display:block;margin:9px 0}.muted{color:#bad0e3}article{padding:14px;border:1px solid #54708a;border-radius:10px;margin:10px 0}a{color:#8ed7ff}#msg{white-space:pre-wrap}</style></head><body><main><a href="./level-up-live.html">← Facilitator Mode</a><h1>Virtual Career Expo · Event Manager</h1><p class="muted">Staff-only event scheduling, powered by the Level Up Supabase database. WEX approval and employer invitations remain in development.</p><section><h2>Staff sign-in</h2><label>Email <input id="email" type="email" placeholder="Your authorized staff email"></label><button id="signin">Email sign-in link</button><button id="signout">Sign out</button><p id="identity"></p></section><section id="workspace" hidden><h2>Create an event</h2><label>Event name <input id="title" placeholder="Pinal Virtual Career Expo" required></label><label>Start (local) <input id="start" type="datetime-local"></label><label>End (local) <input id="end" type="datetime-local"></label><label>Time zone <select id="tz"><option value="America/Phoenix">Arizona (MST)</option><option value="America/Denver">Mountain</option><option value="America/Chicago">Central</option><option value="America/New_York">Eastern</option></select></label><label>Booth capacity <input id="capacity" type="number" min="1" max="50" value="10"></label><button id="create">Create draft event</button><h2>Events</h2><div id="events"></div></section><p id="msg" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.min.js"></script><script>const sb=window.supabase.createClient('https://dnijrzotfyvmmnmueknk.supabase.co','sb_publishable_qSEo4iczJBozMaSIvTKisw_BsJy-iPc');
const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t;let current=null;
function localIso(v,tz){if(!v)throw Error('Start and end are required.');const d=new Date(v);if(Number.isNaN(d.valueOf()))throw Error('Invalid date.');const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});const desired=v.replace('T',' ').slice(0,16);let guess=d.getTime();for(let i=0;i<3;i++){const parts=Object.fromEntries(fmt.formatToParts(new Date(guess)).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));const got=parts.year+'-'+parts.month+'-'+parts.day+' '+parts.hour+':'+parts.minute;const correction=(Date.parse(desired.replace(' ','T')+'Z')-Date.parse(got.replace(' ','T')+'Z'));guess+=correction;if(!correction)break;}return new Date(guess).toISOString();}
async function refresh(){const {data,error}=await sb.from('expo_events').select('id,title,slug,starts_at,ends_at,status,timezone').order('starts_at',{ascending:false}).limit(40);if(error){say(error.message);return}const root=$('events');root.replaceChildren();for(const e of data){const box=document.createElement('article');const h=document.createElement('strong');h.textContent=e.title;box.append(h,document.createElement('br'));const info=document.createElement('span');info.textContent=new Date(e.starts_at).toLocaleString()+' · '+e.status+' · '+e.timezone;box.append(info,document.createElement('br'));const url=document.createElement('a');url.href='https://pinalworkforce1-del.github.io/Level_Up_Portal/expo/?event='+encodeURIComponent(e.slug);url.textContent='Participant preview';url.target='_blank';box.append(url,document.createElement('br'));const sel=document.createElement('select');for(const status of ['draft','setup','registration','lobby','live','closed']){const o=document.createElement('option');o.value=status;o.textContent=status;if(e.status===status)o.selected=true;sel.append(o)}const b=document.createElement('button');b.textContent='Update status';b.onclick=async()=>{const {error}=await sb.from('expo_events').update({status:sel.value}).eq('id',e.id);if(error)say(error.message);else{say('Event updated.');refresh()}};box.append(sel,b);root.append(box)}}
$('signin').onclick=async()=>{const email=$('email').value.trim();if(!email)return say('Enter your email.');const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});say(error?error.message:'Check your email for the sign-in link.')};
$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('create').onclick=async()=>{try{const title=$('title').value.trim();if(!title)throw Error('Enter an event name.');const tz=$('tz').value,starts_at=localIso($('start').value,tz),ends_at=localIso($('end').value,tz);if(ends_at<=starts_at)throw Error('End must be after start.');const {error}=await sb.from('expo_events').insert({title,slug:'expo-'+crypto.randomUUID().slice(0,12),starts_at,ends_at,timezone:tz,booth_capacity:Number($('capacity').value),status:'draft',created_by:current.id});if(error)throw error;say('Draft event created.');refresh()}catch(e){say(e.message)}};
async function init(){const {data:{user}}=await sb.auth.getUser();current=user;$('identity').textContent=user?'Signed in as '+user.email:'Sign in with an authorized staff account.';$('workspace').hidden=!user;if(user)refresh()}sb.auth.onAuthStateChange(()=>setTimeout(init,0));init();
</script></body></html>
