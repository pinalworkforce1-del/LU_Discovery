name: Nova Resume Studio Browser Smoke
on:
  pull_request:
    paths:
      - 'public/nova-resume-port/**'
      - 'tests/nova-resume-browser.smoke.cjs'
      - '.github/workflows/nova-resume-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install project and browser test dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8765 --strictPort >/tmp/nova-vite.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/LU_Discovery/nova-resume-port/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nova-vite.log
          exit 1
      - name: Run browser smoke test (mocked backend)
        run: node tests/nova-resume-browser.smoke.cjs
      - name: Upload screenshot even when test fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nova-resume-browser-screenshot
          path: test-results/
          if-no-files-found: ignore
