name: Nova Resume Studio Contract Checks
on:
  push:
    branches: ['northern-resume-builder-port-20261111']
  pull_request:
    paths:
      - 'public/nova-resume-port/**'
      - 'tests/nova-resume-contract.test.cjs'
      - '.github/workflows/nova-resume-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node tests/nova-resume-contract.test.cjs
