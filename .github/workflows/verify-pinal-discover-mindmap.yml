name: Verify My Path Forward in Discover Me Coach View
on:
  pull_request:
    paths:
      - 'scripts/patch-career-tree-coach-dashboard.py'
      - 'public/coach-career-tree.html'
      - '.github/workflows/verify-pinal-discover-mindmap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical Career Tree coach patch
        run: python scripts/patch-career-tree-coach-dashboard.py
      - name: Verify integrated Discover Me Mind Map
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/coach-career-tree.html').read_text()
          assert 'function pinalMindMapHtml(d)' in s
          assert "module==='discover_me'?discoverHtml(ct.discover_me)+pinalMindMapHtml(ct.my_path_forward)" in s
          assert "discoverHtml(ct.discover_me)+pinalMindMapHtml(ct.my_path_forward)+exploreHtml(ct.explore_careers)" in s
          assert "String(p.county||'').toLowerCase()==='pinal'" not in s
          assert "p?.county==='Pinal'?ct.my_path_forward" not in s
          assert 'My Path Forward · Mind Map' in s
          assert "careerModule(p,'my-path-forward')" in s
          assert "const mods=[['Discover Me'" in s
          assert "done+' / 3 complete" in s
          assert 'Action specificity opportunity' in s
          assert 'Suggested coaching priorities' in s
          assert 'suggested_coaching_priorities' in s
          assert 'action_specificity?.suggested_prompt' in s
          assert "module==='discover_me'?discoverHtml(ct.discover_me)+pinalMindMapHtml(" in s
          assert "done+' / 3 complete" in s
          assert 'readiness dimensions' in s.lower()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/coach-view-inline.js').write_text('\n'.join(scripts))
          print('Mind Map available in all-region Discover Me. Three required modules preserved.')
          PY
          node --check /tmp/coach-view-inline.js
